name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ llvm-19 clang-19

      - name: Compilar syltc
        run: make

      - name: Suite de pruebas
        run: make test
